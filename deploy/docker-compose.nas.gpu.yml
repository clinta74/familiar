# The NAS's RTX 3060 (12 GB), for a Linux host with the NVIDIA container toolkit.
#
#     docker compose -f docker-compose.nas.yml -f docker-compose.nas.gpu.yml up -d
#
# A reservation isn't exclusive: these services share the card. muwbta's ollama must be stopped
# (PLAN.md §10.3) - its 8.4 GB model and this stack don't fit on 12 GB together:
#
#     familiar-chat (gemma4:12b, 8k)         ~8.9 GB
#     whisper small/distil + Kokoro          ~1.5 GB
#     total                                  ~10.4 GB of ~11.5 GB usable
#
# Each service below is self-contained, so one can be kept on the CPU by deleting (or commenting
# out) its block. If the card is tighter than measured, move speech first; the LLM must have it.
#
# Verify:
#     docker exec familiar-ollama nvidia-smi
#     docker logs familiar-ollama | grep "inference compute"      -> library=CUDA
#     docker exec familiar-ollama ollama ps                        -> PROCESSOR 100% GPU

services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      OLLAMA_FLASH_ATTENTION: "1"
      # Half the memory the context reserves (needs flash attention): headroom on a 12 GB card so
      # Whisper, loading when someone first talks, isn't out of memory.
      OLLAMA_KV_CACHE_TYPE: q8_0

  stt:
    image: ghcr.io/speaches-ai/speaches:${STT_GPU_TAG:-latest-cuda}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  tts:
    image: ghcr.io/remsky/kokoro-fastapi-gpu:${TTS_GPU_TAG:-latest}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

name: Android

# The Android app on a pull request that touches it: its tests and a debug build, nothing kept.
# Pushes to main don't build it - a version tag builds it once, signed (release.yml).
on:
  pull_request:
    branches: [main]
    paths:
      - mobile/**
      # The app bundles the avatar page, built from client/ (docs/MOBILE.md §1.1).
      - client/**
      - protocol/**
      - .github/workflows/android.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - uses: gradle/actions/setup-gradle@v4
      # Compose 1.12 compiles against API 37; the runner image may not have it yet.
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null
      - run: ./gradlew :shared:testAndroidHostTest :androidApp:assembleDebug --console=plain

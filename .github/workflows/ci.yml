name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  IMAGE_NAMESPACE: ${{ secrets.DOCKER_USERNAME }}

jobs:
  # Server tests start a real Postgres via Testcontainers; ubuntu runners have Docker.
  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build Familiar.slnx -c Release
      - run: dotnet test Familiar.slnx -c Release --no-build

  test-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The TypeScript and Kotlin protocol types match protocol/familiar.schema.json (the server's
      # tests check the schema matches its records): docs/MOBILE.md §6.
      - run: npm run protocol:check
      - run: npm test

  # The Android app (docs/MOBILE.md): shared tests, and a debug APK to sideload, kept as an artifact.
  # A version tag also publishes a signed release APK (android-release, below).
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The app bundles the avatar page, built from client/ (docs/MOBILE.md §1.1).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - uses: gradle/actions/setup-gradle@v4
      # Compose 1.12 compiles against API 37; the runner image may not have it yet.
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null
      - run: ./gradlew :shared:testAndroidHostTest :androidApp:assembleDebug --console=plain
      # Handy for a look, not for keeping: every push makes one (~28 MB) and the account's artifact
      # storage filled up at 30 days each. Releases carry the APK to install. A full store
      # doesn't fail the build.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: familiar-android-debug
          path: mobile/androidApp/build/outputs/apk/debug/*.apk
          retention-days: 3

  # A version tag (v1.2.3) publishes a GitHub release with the APK signed by the release key, to
  # sideload and update over (docs/RELEASING.md). The key is the repository's ANDROID_* secrets.
  android-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-server, test-client, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - uses: gradle/actions/setup-gradle@v4
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::No release key: add the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets (docs/RELEASING.md)."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "FAMILIAR_SIGNING_STORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          FAMILIAR_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FAMILIAR_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FAMILIAR_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease -Pfamiliar.version="${GITHUB_REF_NAME#v}" --console=plain

      - name: Check the signature
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs androidApp/build/outputs/apk/release/*.apk

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          apk="familiar-$version.apk"
          cp androidApp/build/outputs/apk/release/*.apk "$apk"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
          else
            prerelease=""
            [[ "$version" == *-* ]] && prerelease="--prerelease"
            gh release create "$GITHUB_REF_NAME" "$apk" --verify-tag --title "Familiar $version" --generate-notes $prerelease
          fi

  # Images are built on every run (so a broken Dockerfile fails the PR) but pushed only from main
  # and version tags.
  images:
    needs: [test-server, test-client]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: familiar-server
            context: .
            dockerfile: ./Dockerfile
          - name: familiar-client
            context: ./client
            dockerfile: ./client/Dockerfile
          - name: familiar-backup
            context: ./tools/backup
            dockerfile: ./tools/backup/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, for `git describe` below.
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAMESPACE || 'local' }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,enable=${{ startsWith(github.ref, 'refs/heads/') }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Resolve build version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            last="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
            count="$(git rev-list --count "${last}..HEAD" 2>/dev/null || git rev-list --count HEAD)"
            version="${last#v}-dev.${count}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

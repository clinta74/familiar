<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <!-- Bundled into the phone apps and loaded from there, never from the network (MOBILE.md §1.1). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob: data:" />
    <title>Familiar avatar</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
      #stage { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
      /* While the character is being built: a soft glow where it will be, then it fades in. */
      #stage > * { transition: opacity 0.4s ease; }
      #stage[data-loading] > * { opacity: 0; }
      #stage[data-loading]::before {
        content: ''; position: absolute; left: 50%; top: 50%; width: min(60%, 220px); aspect-ratio: 1; border-radius: 50%;
        background: radial-gradient(circle, rgb(155 130 255 / 0.38), transparent 68%);
        transform: translate(-50%, -50%); animation: wait 1.8s ease-in-out infinite;
      }
      @keyframes wait {
        0%, 100% { opacity: 0.45; transform: translate(-50%, -50%) scale(0.92); }
        50% { opacity: 1; transform: translate(-50%, -50%) scale(1.04); }
      }
      @media (prefers-reduced-motion: reduce) { #stage[data-loading]::before { animation: none; } }
    </style>
  </head>
  <body>
    <div id="stage" data-loading></div>
    <script type="module" src="/src/embed/avatarEmbed.ts"></script>
  </body>
</html>

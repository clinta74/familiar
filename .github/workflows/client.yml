name: Client

# The web client's checks and image, only when something it's built from changes. The image is
# pushed from main as latest; a version tag's images come from release.yml.
on:
  push:
    branches: [main]
    paths:
      - client/**
      - protocol/**
      # protocol:check checks the app's protocol types against the schema too.
      - mobile/shared/src/commonMain/kotlin/app/familiar/shared/protocol/Generated.kt
      - .github/workflows/client.yml
      - .github/actions/image/**
  pull_request:
    branches: [main]
    paths:
      - client/**
      - protocol/**
      - mobile/shared/src/commonMain/kotlin/app/familiar/shared/protocol/Generated.kt
      - .github/workflows/client.yml
      - .github/actions/image/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The TypeScript and Kotlin protocol types match protocol/familiar.schema.json (the server's
      # tests check the schema matches its records): docs/MOBILE.md §6.
      - run: npm run protocol:check
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: ./.github/actions/image
        with:
          name: familiar-client
          context: ./client
          dockerfile: ./client/Dockerfile
          namespace: ${{ secrets.DOCKER_USERNAME }}
          push: ${{ github.event_name != 'pull_request' }}

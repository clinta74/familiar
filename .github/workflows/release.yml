name: Release

# A version tag (v1.2.3), on a commit main has already tested: the Android app, built once - its
# tests, then the APK signed by the release key, published as a GitHub release to sideload and
# update over (docs/RELEASING.md) - and the images tagged 1.2.3 and 1.2. The server and client tests
# aren't run again: main's run of this commit did that.
on:
  push:
    tags: ["v*"]

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The app bundles the avatar page, built from client/ (docs/MOBILE.md §1.1).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - uses: gradle/actions/setup-gradle@v4
      # Compose 1.12 compiles against API 37; the runner image may not have it yet.
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::No release key: add the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets (docs/RELEASING.md)."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "FAMILIAR_SIGNING_STORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          FAMILIAR_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FAMILIAR_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FAMILIAR_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :shared:testAndroidHostTest :androidApp:assembleRelease -Pfamiliar.version="${GITHUB_REF_NAME#v}" --console=plain

      - name: Check the signature
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs androidApp/build/outputs/apk/release/*.apk

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          apk="familiar-$version.apk"
          cp androidApp/build/outputs/apk/release/*.apk "$apk"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
          else
            prerelease=""
            [[ "$version" == *-* ]] && prerelease="--prerelease"
            gh release create "$GITHUB_REF_NAME" "$apk" --verify-tag --title "Familiar $version" --generate-notes $prerelease
          fi

  # All three in one job, from the tag's own source - mostly cache hits, since main built the same
  # commit - so a pinned version is exactly that release.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: ./.github/actions/image
        with:
          name: familiar-server
          context: .
          dockerfile: ./Dockerfile
          namespace: ${{ secrets.DOCKER_USERNAME }}
          push: "true"
      - uses: ./.github/actions/image
        with:
          name: familiar-client
          context: ./client
          dockerfile: ./client/Dockerfile
          namespace: ${{ secrets.DOCKER_USERNAME }}
          push: "true"
      - uses: ./.github/actions/image
        with:
          name: familiar-backup
          context: ./tools/backup
          dockerfile: ./tools/backup/Dockerfile
          namespace: ${{ secrets.DOCKER_USERNAME }}
          push: "true"
